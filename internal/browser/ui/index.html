<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SamWeb</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <!-- ===================== Tab strip ===================== -->
  <div id="tab-strip" class="tab-strip">
    <div id="tabs" class="tabs"></div>
    <button id="new-tab-btn" class="new-tab-btn" title="New tab (Ctrl+T)">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
        <line x1="12" y1="5" x2="12" y2="19"></line>
        <line x1="5" y1="12" x2="19" y2="12"></line>
      </svg>
    </button>
  </div>

  <!-- ===================== Toolbar (nav + omnibox) ===================== -->
  <div id="toolbar" class="toolbar">
    <div class="nav-buttons">
      <button id="back-btn" class="icon-btn" title="Back (Alt+Left)" disabled>
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="15 18 9 12 15 6"></polyline></svg>
      </button>
      <button id="forward-btn" class="icon-btn" title="Forward (Alt+Right)" disabled>
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="9 18 15 12 9 6"></polyline></svg>
      </button>
      <button id="reload-btn" class="icon-btn" title="Reload (Ctrl+R)">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="23 4 23 10 17 10"></polyline><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"></path></svg>
      </button>
      <button id="home-btn" class="icon-btn" title="Home">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path><polyline points="9 22 9 12 15 12 15 22"></polyline></svg>
      </button>
    </div>

    <div id="omnibox-wrap" class="omnibox-wrap">
      <span id="omnibox-icon" class="omnibox-icon">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
      </span>
      <input id="omnibox" class="omnibox" type="text" autocomplete="off" spellcheck="false" placeholder="Search Google or type a URL" />
      <div id="omnibox-suggestions" class="omnibox-suggestions hidden"></div>
      <button id="bookmark-btn" class="omnibox-action" title="Bookmark this page">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"></path></svg>
      </button>
      <button id="open-direct-btn" class="omnibox-action" title="直接打开（不走 iframe，绕过 X-Frame-Options，用于登录 z.ai 等网站）">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"></path><polyline points="15 3 21 3 21 9"></polyline><line x1="10" y1="14" x2="21" y2="3"></line></svg>
      </button>
    </div>

    <div class="toolbar-actions">
      <!-- Profile selector: switch between multiple accounts on the same site -->
      <div id="profile-wrap" class="profile-wrap" title="Cookie profile (switch accounts)">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
        <select id="profile-select" class="profile-select" title="Switch cookie profile">
          <option value="">默认（无 profile）</option>
        </select>
        <button id="profile-save-btn" class="profile-action" title="Save current cookies to a profile">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"></path><polyline points="17 21 17 13 7 13 7 21"></polyline><polyline points="7 3 7 8 15 8"></polyline></svg>
        </button>
        <button id="profile-manage-btn" class="profile-action" title="Manage profiles (rename / delete)">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="1"></circle><circle cx="19" cy="12" r="1"></circle><circle cx="5" cy="12" r="1"></circle></svg>
        </button>
      </div>
      <button id="history-btn" class="icon-btn" title="History (Ctrl+H)">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"></circle><polyline points="12 6 12 12 16 14"></polyline></svg>
      </button>
      <button id="bookmarks-btn" class="icon-btn" title="Bookmarks">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"></path></svg>
      </button>
      <button id="engine-btn" class="icon-btn" title="Search engine">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path></svg>
      </button>
      <button id="spawn-all-btn" class="icon-btn" title="遍历打开所有 profile 窗口（每个 profile 一个独立窗口，同时在线）" style="color:#1a73e8">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="3" width="20" height="14" rx="2" ry="2"></rect><line x1="8" y1="21" x2="16" y2="21"></line><line x1="12" y1="17" x2="12" y2="21"></line><path d="M6 8h2M6 11h2M10 8h2M10 11h2M14 8h2M14 11h2"></path></svg>
      </button>
    </div>
  </div>

  <!-- ===================== Content area ===================== -->
  <div id="content" class="content">
    <iframe id="view" class="view" sandbox="allow-scripts allow-forms allow-popups allow-same-origin allow-presentation" referrerpolicy="no-referrer"></iframe>
  </div>

  <!-- ===================== Popovers ===================== -->
  <div id="popover-mask" class="popover-mask hidden"></div>

  <div id="engine-popover" class="popover hidden">
    <div class="popover-title">Search engine</div>
    <div id="engine-list" class="engine-list"></div>
  </div>

  <div id="history-popover" class="popover hidden">
    <div class="popover-title">History</div>
    <div id="history-list" class="link-list"></div>
    <button id="clear-history" class="popover-action">Clear all</button>
  </div>

  <div id="bookmarks-popover" class="popover hidden">
    <div class="popover-title">Bookmarks</div>
    <div id="bookmarks-list" class="link-list"></div>
  </div>

  <div id="profile-popover" class="popover hidden">
    <div class="popover-title">Cookie Profiles</div>
    <div id="profile-list" class="link-list"></div>
    <div class="profile-create-row">
      <input id="profile-new-name" type="text" placeholder="New profile name" autocomplete="off" />
      <button id="profile-create-btn" class="popover-action">Save current</button>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
